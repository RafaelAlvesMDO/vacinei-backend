version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vacinei-postgres
    restart: always
    # Credenciais lidas do .env (veja o .env.example). Só valem na criação do volume pgdata.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-vacinei_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Serviço HTTP do OCR (D25 / D34), chamado pelo backend em OCR_SERVICE_URL. Não grava imagens.
  ocr-api:
    build: ./ocr-service
    image: vacinei-ocr
    container_name: vacinei-ocr
    restart: unless-stopped
    environment:
      OCR_MAX_IMAGE_MB: ${OCR_MAX_IMAGE_MB:-8}
    ports:
      - "8000:8000"

  # Prova de conceito e avaliação do OCR, com as fotos de teste. Só sobe com:
  #   docker compose --profile ocr run --rm ocr                               (PoC: página inteira e âncoras)
  #   docker compose --profile ocr run --rm ocr python avaliar_templates.py   (modelos de caderneta, D34)
  ocr:
    image: vacinei-ocr
    build: ./ocr-service
    profiles: ["ocr"]
    command: ["python", "poc_ocr.py", "--entrada", "/amostras", "--saida", "/saida"]
    volumes:
      - ${OCR_SAMPLES_DIR:-./ocr-service/amostras}:/amostras:ro
      - ${OCR_OUTPUT_DIR:-./ocr-service/saida}:/saida

volumes:
  pgdata: