version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vacinei-postgres
    restart: always
    environment:
      POSTGRES_USER: rafael
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: vacinei_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Prova de conceito do OCR (D25). Só sobe com: docker compose --profile ocr run --rm ocr
  ocr:
    build: ./ocr-service
    profiles: ["ocr"]
    volumes:
      - ${OCR_SAMPLES_DIR:-./ocr-service/amostras}:/amostras:ro
      - ${OCR_OUTPUT_DIR:-./ocr-service/saida}:/saida

volumes:
  pgdata: