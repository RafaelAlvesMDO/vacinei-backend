version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vacinei-postgres
    restart: always
    environment:
      POSTGRES_USER: rafael
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: vacinei_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: